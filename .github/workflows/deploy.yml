name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 문서가 300편을 넘으면서 Node 기본 힙 상한(약 4GB)에 걸려 빌드가 OOM으로 죽었다.
      # 러너 메모리는 16GB이므로 상한만 올려 준다. (891편에서 8GB도 초과해 12GB로 상향)
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=12288

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4