name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 비공개 저장소용 표준 러너의 물리 메모리를 넘지 않도록 Node 힙에 여유를 둔다.
      # Turbopack과 단일 정적 생성 워커로 대규모 MDX 빌드의 최대 메모리를 낮춘다.
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
