name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add swap space for the MDX build
        run: |
          sudo fallocate -l 2G /swapfile-zeno
          sudo chmod 600 /swapfile-zeno
          sudo mkswap /swapfile-zeno
          sudo swapon /swapfile-zeno
          free -h
          df -h /

      - run: npm ci

      # 비공개 저장소용 표준 러너의 물리 메모리를 넘지 않도록 Node 힙에 여유를 둔다.
      # Turbopack·단일 정적 생성 워커·스왑으로 대규모 MDX 빌드의 메모리를 관리한다.
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Pages에는 out만 필요하다. 빌드 중간물과 스왑을 먼저 치워 아티팩트 압축 공간을 확보한다.
      - name: Reclaim build space
        run: |
          rm -rf .next
          sudo swapoff /swapfile-zeno
          sudo rm -f /swapfile-zeno
          df -h /

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
